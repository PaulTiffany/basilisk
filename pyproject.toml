[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "map-lb"
version = "0.2.0.dev0"
description = "Reference controller for Mutually Assured Progress under Lipschitz Bounds"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Paul Carver Tiffany III"}
]
keywords = [
  "AI control",
  "human-in-the-loop",
  "Lipschitz",
  "audit ledger",
  "agent authorization"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]

[project.optional-dependencies]
verification = [
  "numpy>=2.0,<3"
]

[project.scripts]
map-lb = "map_lb.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
