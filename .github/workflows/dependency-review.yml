# Governing philosophy: PHILOSOPHY.md
# BIS supply-chain gate: PROJECT_GRAPH.json
name: BIS / dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bis-dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: BIS / dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 4
          show-patched-versions: true
