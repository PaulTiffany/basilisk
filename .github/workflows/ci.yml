name: BIS / bootstrap

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: bis-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: BIS / bootstrap runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: python3 -m pip install --disable-pip-version-check '.[verification]'

      - name: Run package and interpretability checks
        run: make package-check

  formal:
    name: BIS / bootstrap formal
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build Lean core
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

  merge-gate:
    name: BIS / bootstrap gate
    if: always()
    needs: [runtime, formal]
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Check out certified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require bootstrap checks
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          test "$FORMAL_RESULT" = success

      - name: Generate certification receipt
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          FORMAL_RESULT: ${{ needs.formal.result }}
        run: |
          python3 verification/certification_receipt.py \
            --output certification-receipt.json \
            --runtime-result "$RUNTIME_RESULT" \
            --formal-result "$FORMAL_RESULT"
          python3 verification/certification_receipt.py --verify certification-receipt.json

      - name: Publish certification summary
        run: |
          {
            echo '## Basilisk certification receipt'
            echo
            echo '```json'
            cat certification-receipt.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload certification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned v7-era main
        with:
          name: certification-receipt-${{ github.sha }}
          path: certification-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish commit certification status
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps({
              "state": "success",
              "target_url": os.environ["TARGET_URL"],
              "description": "package-check + Lean build green",
              "context": "basilisk/certification",
          }).encode("utf-8")
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
          print(
              "CERTIFICATION STATUS PUBLISHED — "
              f"sha={result['sha']} context={result['context']} state={result['state']}"
          )
          PY
